name: hris_ammanitech
description: "HRIS Ammani Tech Group - Clean Architecture Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - asset/logo/
    - asset/image/
    - assets/icons/
    - assets/images/
    - assets/images/logos/
    - assets/images/profiles/
    - assets/json/
