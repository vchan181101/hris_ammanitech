name: hris_ammanitech
description: "HRIS Ammani Tech Group - Clean Architecture Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.2
  camera_windows: ^0.3.0+1
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  google_maps_flutter: ^2.10.0
  flutter_compass: ^0.8.1
  intl: ^0.19.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - asset/logo/
    - asset/icons/
    - asset/image/
    - asset/json/
